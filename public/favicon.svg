<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10151F"/>
      <stop offset="100%" stop-color="#070A11"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#45E6C4"/>
      <stop offset="100%" stop-color="#8B7FFF"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#45E6C4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8B7FFF" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- background rounded square -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)" stroke="url(#border)" stroke-width="6"/>

  <!-- subtle grid texture -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="2">
    <line x1="0" y1="171" x2="512" y2="171"/>
    <line x1="0" y1="341" x2="512" y2="341"/>
    <line x1="171" y1="0" x2="171" y2="512"/>
    <line x1="341" y1="0" x2="341" y2="512"/>
  </g>

  <!-- soft glow behind letter -->
  <circle cx="230" cy="256" r="150" fill="#45E6C4" opacity="0.08"/>

  <!-- D monogram -->
  <text x="196" y="338" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="288" fill="#EDF0F5" text-anchor="middle">D</text>

  <!-- accent dot, echoing the "DEV." wordmark -->
  <circle cx="368" cy="336" r="30" fill="url(#dot)"/>
</svg>
